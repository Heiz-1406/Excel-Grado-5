<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Colorea según el patrón</title><style>body{font-family:Arial;background:#eaf0f4;margin:0;padding:20px}.app{max-width:800px;margin:auto;background:#fff;border:4px solid #333;border-radius:25px;padding:25px}h1{text-align:center}.palette,.seq{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.color,.circle{width:58px;height:58px;border-radius:50%;border:3px solid #555;cursor:pointer;font-weight:bold;font-size:20px}.c1{background:#39a9d8}.c2{background:#d86b43}.c3{background:#43bd31}.c4{background:#f1dc00}.c5{background:#ed3d3d}.selected{outline:5px solid #222}table{width:100%;border-collapse:collapse;margin-top:25px}td,th{border:1px solid #bbb;padding:12px;text-align:center}th{font-size:20px}.circle{background:white}.ok{border-color:#198754!important}.bad{border-color:#e33!important}.action{padding:13px 20px;border:0;border-radius:10px;background:#198754;color:white;font-size:17px;font-weight:bold;margin:8px;cursor:pointer}.controls{text-align:center;margin-top:20px}#msg{text-align:center;font-weight:bold;font-size:20px}</style></head><body><div class='app'><h1>🎨 Colorea según el patrón</h1><p><b>Instrucciones:</b> selecciona el color según el número y pinta los círculos de cada fila.</p><div class='palette'><button class='color c1' data-color='1'>1</button><button class='color c2' data-color='2'>2</button><button class='color c3' data-color='3'>3</button><button class='color c4' data-color='4'>4</button><button class='color c5' data-color='5'>5</button></div><table><thead><tr><th>Código</th><th>Números</th></tr></thead><tbody id='rows'></tbody></table><div class='controls'><button class='action' onclick='check()'>✅ Comprobar</button><button class='action' onclick='resetGame()'>🔄 Intentar nuevamente</button><div id='msg'></div></div></div><script src='colorea-segun-patron.js'></script></body></html>
